[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "timeflip_tracker/src"}

[tool.setuptools.packages.find]
where = ["timeflip_tracker/src"]

[project]
name = "timeflip_tracker"
version = "0.0.0"
dependencies = [
    "aiooui",
    "autopep8",
    "bleak",
    "bluetooth-adapters",
    "certifi",
    "charset-normalizer",
    "colour",
    "dbus-fast",
    "dbus-next",
    "flake8",
    "idna",
    "mariadb",
    "mccabe",
    "packaging",
    "prometheus_client",
    "pycodestyle",
    "pyflakes",
    "python-dotenv",
    "pytimefliplib @ git+https://github.com/pierre-24/pytimefliplib.git",
    "requests",
    "ruamel.yaml",
    "ruamel.yaml.clib",
    "toml",
    "typing_extensions",
    "urllib3",
    "usb-devices"
]
requires-python = ">=3.8"

[project.scripts]
timeflip-tracker = "timeflip_tracker:run_main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["timeflip_tracker/src"]
testpaths = ["timeflip_tracker/tests"]
